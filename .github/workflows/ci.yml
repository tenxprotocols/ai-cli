name: ci

# The two paths-ignore lists are duplicated on purpose: the workflow parser
# does not support YAML anchors, so they cannot be shared.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# A newer push to the same branch makes the running one irrelevant, so stop it
# rather than pay for both.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
