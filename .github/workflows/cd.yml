name: CD

on:
  push:
    tags:
      - 'v*.*.*'

# Releases are never cancelled mid-flight: a half-published release is worse
# than a slow one.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same gate pull requests pass. A tag on an unverified commit stops here
  # instead of shipping.
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: Create Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history for the changelog.
          fetch-depth: 0
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Release
        run: task release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
